<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Bookings — TalesUber</title>
  <link rel="stylesheet" href="../css/main.css" />
  <style>
    .filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
    .filter-btn{padding:8px 18px;border-radius:100px;border:1px solid var(--border);background:var(--ink-2);color:var(--text-muted);font-size:0.85rem;cursor:pointer;transition:all .2s}
    .filter-btn:hover,.filter-btn.active{background:var(--amber);color:var(--ink);border-color:var(--amber);font-weight:600}
    .bookings-list{display:flex;flex-direction:column;gap:14px}
    .booking-card{background:var(--ink-2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition:all .2s;cursor:pointer}
    .booking-card:hover{border-color:rgba(245,158,11,.3);transform:translateY(-1px)}
    .booking-card-top{display:grid;grid-template-columns:56px 1fr auto;gap:16px;align-items:center}
    .bv-icon{width:52px;height:52px;background:var(--surface);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:1.6rem}
    .b-route-from{font-weight:700;font-size:0.97rem}
    .b-route-to{font-size:0.85rem;color:var(--text-muted);margin-top:3px;display:flex;align-items:center;gap:6px}
    .b-amount{font-family:'Syne',sans-serif;font-size:1.15rem;font-weight:800;color:var(--amber);text-align:right}
    .b-meta{display:flex;gap:16px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);flex-wrap:wrap}
    .b-meta-item{font-size:0.78rem;color:var(--text-muted);display:flex;align-items:center;gap:5px}
    .booking-detail{margin-top:16px;padding-top:16px;border-top:1px solid var(--border);display:none}
    .booking-card.expanded .booking-detail{display:block}
    .status-progress{display:flex;align-items:center;gap:0;margin:16px 0}
    .sp-step{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;position:relative}
    .sp-dot{width:32px;height:32px;border-radius:50%;background:var(--surface);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:0.85rem;position:relative;z-index:1;transition:all .3s}
    .sp-step.done .sp-dot{background:var(--green);border-color:var(--green)}
    .sp-step.active .sp-dot{background:var(--amber);border-color:var(--amber);animation:pulse 1.5s infinite}
    .sp-label{font-size:0.72rem;color:var(--text-muted);text-align:center}
    .sp-step.done .sp-label,.sp-step.active .sp-label{color:var(--text)}
    .sp-line{flex:1;height:2px;background:var(--border);margin:0 -2px;margin-bottom:22px}
    .sp-line.done{background:var(--green)}
    .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
    .detail-item{background:var(--surface);border-radius:var(--radius-sm);padding:12px}
    .detail-label{font-size:0.72rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
    .detail-value{font-size:0.9rem;font-weight:600}
    .empty-state{text-align:center;padding:64px 24px;color:var(--text-muted)}
    .skeleton{background:linear-gradient(90deg,var(--surface) 25%,var(--surface-2) 50%,var(--surface) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:var(--radius-sm);height:80px;margin-bottom:14px}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  </style>
</head>
<body>
<div id="page-loader"><div class="loader-logo">TalesUber</div><div class="loader-bar"><div class="loader-bar-fill"></div></div></div>
<div id="toast-container"></div>

<nav class="navbar">
  <a href="dashboard.html" class="navbar-brand">
    <div class="navbar-logo">🚗</div>
    <span class="navbar-brand-text">Tales<span>Uber</span></span>
  </a>
  <div class="navbar-links">
    <a href="book.html" class="btn btn-primary btn-sm">+ Book Ride</a>
    <button class="btn btn-secondary btn-sm" id="logout-btn">Sign Out</button>
  </div>
</nav>

<div class="page-content">
  <div class="dash-layout">
    <aside class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">Main</div>
        <a href="dashboard.html" class="sidebar-link"><span class="sidebar-icon">🏠</span> Home</a>
        <a href="book.html" class="sidebar-link"><span class="sidebar-icon">➕</span> New Booking</a>
        <a href="bookings.html" class="sidebar-link active"><span class="sidebar-icon">📋</span> My Bookings</a>
        <a href="group-booking.html" class="sidebar-link"><span class="sidebar-icon">👥</span> Group Booking</a>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">Account</div>
        <a href="profile.html" class="sidebar-link"><span class="sidebar-icon">👤</span> My Profile</a>
        <a href="history.html" class="sidebar-link"><span class="sidebar-icon">🕐</span> Trip History</a>
      </div>
      <div class="sidebar-user">
        <div class="sidebar-user-name" id="su-name">—</div>
        <div class="sidebar-user-email" id="su-email"></div>
      </div>
    </aside>

    <main class="dash-main" id="main-content" style="opacity:0;transition:opacity .4s">
      <div class="dash-header">
        <div>
          <h1 class="dash-title">My Bookings</h1>
          <p class="dash-subtitle">Track all your rides in real-time</p>
        </div>
        <a href="book.html" class="btn btn-primary">+ New Booking</a>
      </div>

      <div class="filter-bar">
        <button class="filter-btn active" data-filter="all">All Rides</button>
        <button class="filter-btn" data-filter="pending">Pending</button>
        <button class="filter-btn" data-filter="confirmed">Confirmed</button>
        <button class="filter-btn" data-filter="in-transit">In Transit</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
        <button class="filter-btn" data-filter="cancelled">Cancelled</button>
      </div>

      <div id="skeleton-list">
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      </div>
      <div class="bookings-list" id="bookings-list"></div>
    </main>
  </div>
</div>

<script type="module">
import { onAuthChange, logoutUser, listenToBookings } from '../js/firebase.js';
import { hideLoader, toast, formatKES, formatDate, statusBadge, timeAgo } from '../js/utils.js';

const STATUS_STEPS = [
  {key:'pending',    label:'Booked',     icon:'📝'},
  {key:'confirmed',  label:'Confirmed',  icon:'✅'},
  {key:'in-transit', label:'In Transit', icon:'🚗'},
  {key:'completed',  label:'Arrived',    icon:'🏁'},
];
const VEHICLE_ICONS = {motorbike:'🏍️','tuk-tuk':'🛺',car:'🚗',suv:'🚙',minibus:'🚐'};

let allBookings = [];
let currentFilter = 'all';

function renderStatusProgress(status) {
  const currentIdx = STATUS_STEPS.findIndex(s => s.key === status);
  if (status === 'cancelled') return `<div style="color:var(--red);font-size:0.88rem;padding:10px 0">❌ This booking was cancelled.</div>`;
  return `<div class="status-progress">
    ${STATUS_STEPS.map((s, i) => {
      const isDone = i < currentIdx || status === 'completed';
      const isActive = i === currentIdx && status !== 'completed';
      const cls = isDone || status==='completed' ? 'done' : isActive ? 'active' : '';
      const lineClass = i < currentIdx || status === 'completed' ? 'done' : '';
      return `
        <div class="sp-step ${cls}">
          <div class="sp-dot">${isDone||status==='completed' ? '✓' : isActive ? s.icon : ''}</div>
          <div class="sp-label">${s.label}</div>
        </div>
        ${i < STATUS_STEPS.length - 1 ? `<div class="sp-line ${lineClass}"></div>` : ''}
      `;
    }).join('')}
  </div>`;
}

function renderBookings(bookings) {
  const list = document.getElementById('bookings-list');
  if (!bookings.length) {
    list.innerHTML = `<div class="empty-state">
      <div style="font-size:3.5rem;margin-bottom:16px">🛣️</div>
      <h3 style="font-family:'Syne',sans-serif;margin-bottom:8px">No rides found</h3>
      <p style="margin-bottom:20px">${currentFilter === 'all' ? "You haven't booked any rides yet." : `No ${currentFilter} rides.`}</p>
      <a href="book.html" class="btn btn-primary">Book Your First Ride</a>
    </div>`;
    return;
  }
  list.innerHTML = bookings.map(b => `
    <div class="booking-card" onclick="toggleDetail('${b.id}')" id="card-${b.id}">
      <div class="booking-card-top">
        <div class="bv-icon">${VEHICLE_ICONS[b.vehicleType] || '🚗'}</div>
        <div>
          <div class="b-route-from">📍 ${b.pickupLocation}</div>
          <div class="b-route-to">→ 🏁 ${b.dropoffLocation}</div>
        </div>
        <div>
          ${statusBadge(b.status)}
          <div class="b-amount" style="margin-top:6px">${formatKES(b.discountedAmount || b.amount)}</div>
        </div>
      </div>
      <div class="b-meta">
        <span class="b-meta-item">🚗 ${b.vehicleName || b.vehicleType}</span>
        <span class="b-meta-item">👥 ${b.passengerCount || 1} passenger${b.passengerCount > 1 ? 's' : ''}</span>
        <span class="b-meta-item">📏 ${b.distanceKm || '—'} km</span>
        <span class="b-meta-item">🕐 ${timeAgo(b.createdAt)}</span>
        ${b.isGroupBooking ? '<span class="b-meta-item" style="color:var(--amber)">👥 Group</span>' : ''}
      </div>
      <div class="booking-detail" id="detail-${b.id}">
        ${renderStatusProgress(b.status)}
        <div class="detail-grid">
          <div class="detail-item"><div class="detail-label">Booking ID</div><div class="detail-value" style="font-family:monospace;font-size:0.78rem">${b.id}</div></div>
          <div class="detail-item"><div class="detail-label">Date & Time</div><div class="detail-value" style="font-size:0.82rem">${formatDate(b.createdAt)}</div></div>
          <div class="detail-item"><div class="detail-label">Base Fare</div><div class="detail-value">${formatKES(b.amount)}</div></div>
          <div class="detail-item"><div class="detail-label">You Paid</div><div class="detail-value text-amber">${formatKES(b.discountedAmount || b.amount)}</div></div>
          ${b.discountAmt > 0 ? `<div class="detail-item"><div class="detail-label">Discount</div><div class="detail-value text-green">−${formatKES(b.discountAmt)} (${b.discountLabel || ''})</div></div>` : ''}
          ${b.notes ? `<div class="detail-item" style="grid-column:1/-1"><div class="detail-label">Notes</div><div class="detail-value">${b.notes}</div></div>` : ''}
        </div>
      </div>
    </div>
  `).join('');
}

window.toggleDetail = function(id) {
  const card = document.getElementById(`card-${id}`);
  card.classList.toggle('expanded');
};

// Filters
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    const filtered = currentFilter === 'all' ? allBookings : allBookings.filter(b => b.status === currentFilter);
    renderBookings(filtered);
  });
});

onAuthChange(async (user) => {
  if (!user) { window.location.href = 'login.html'; return; }
  document.getElementById('su-name').textContent = user.displayName || user.email;
  document.getElementById('su-email').textContent = user.email;

  listenToBookings(user.uid, (bookings) => {
    allBookings = bookings;
    document.getElementById('skeleton-list').style.display = 'none';
    const filtered = currentFilter === 'all' ? allBookings : allBookings.filter(b => b.status === currentFilter);
    renderBookings(filtered);
  });

  document.getElementById('main-content').style.opacity = '1';
  hideLoader();
});

document.getElementById('logout-btn').addEventListener('click', async () => { const {logoutUser} = await import('../js/firebase.js'); await logoutUser(); });
</script>
</body>
</html>
